name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build User Service
        working-directory: ./user-service
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Account Service
        working-directory: ./account-service
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Transaction Service
        working-directory: ./transaction-service
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Logging Service
        working-directory: ./logging-service
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build bff Service
        working-directory: ./bff-service
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Start Docker Compose
        working-directory: ./infrastructure
        run: docker compose up -d

      - name: Wait for Services
        run: sleep 20

      - name: Verify Running Containers
        run: docker ps

      - name: Stop Docker Compose
        if: always()
        working-directory: ./infrastructure
        run: docker compose down