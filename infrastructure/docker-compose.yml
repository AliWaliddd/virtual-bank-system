services:
  postgres:
    image: postgres:16
    container_name: vbank-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: vbank
      POSTGRES_PASSWORD: vbank_password
      POSTGRES_DB: vbank_users

    ports:
      - "5432:5432"

    volumes:
      - vbank-postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbank -d vbank_users"]
      interval: 5s
      timeout: 5s
      retries: 10

  wso2-apim:
    image: wso2/wso2am:4.7.0
    container_name: vbank-wso2-apim
    restart: unless-stopped

    ports:
      # Publisher, Developer Portal, Admin Portal, OAuth token endpoint
      - "9443:9443"

      # HTTPS API Gateway
      - "8243:8243"

      # HTTP API Gateway
      - "8280:8280"

    volumes:
      # Persist WSO2's local development database
      - vbank-wso2-database:/home/wso2carbon/wso2am-4.7.0/repository/database

      # Persist WSO2 logs
      - vbank-wso2-logs:/home/wso2carbon/wso2am-4.7.0/repository/logs

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  transaction-service:
        build:
          context: ../transaction-service
          dockerfile: Dockerfile

        container_name: transaction-service

        ports:
          - "8083:8083"

        depends_on:
          postgres:
            condition: service_healthy
          kafka:
            condition: service_started
        environment:
          SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile

    container_name: user-service

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
          SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  account-service:
      build:
        context: ../account-service
        dockerfile: Dockerfile

      container_name: account-service

      ports:
        - "8082:8082"

      depends_on:
        postgres:
          condition: service_healthy
        kafka:
          condition: service_started
      environment:
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  bff-service:
    build:
      context: ../bff-service
      dockerfile: Dockerfile
    container_name: bff-service
    environment:
      BFF_SERVICE_PORT: 8084
      USER_SERVICE_BASE_URL: http://user-service:8081
      ACCOUNT_SERVICE_BASE_URL: http://account-service:8082
      TRANSACTION_SERVICE_BASE_URL: http://transaction-service:8083
      BFF_CONNECT_TIMEOUT: ${BFF_CONNECT_TIMEOUT:-2s}
      BFF_RESPONSE_TIMEOUT: ${BFF_RESPONSE_TIMEOUT:-3s}
      BFF_REQUEST_TIMEOUT: ${BFF_REQUEST_TIMEOUT:-4s}
      BFF_TRANSACTION_CONCURRENCY: ${BFF_TRANSACTION_CONCURRENCY:-8}
    ports:
      - "8084:8084"
    depends_on:
      user-service:
        condition: service_started
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started

  logging-service:
    build:
      context: ../logging-service
      dockerfile: Dockerfile

    container_name: logging-service

    ports:
      - "8085:8085"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vbank_logs
      SPRING_DATASOURCE_USERNAME: vbank
      SPRING_DATASOURCE_PASSWORD: vbank_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started


volumes:
  vbank-postgres-data:
  vbank-wso2-database:
  vbank-wso2-logs:
