server:
  port: 8083

spring:
  kafka:
    bootstrap-servers: kafka:9092
  application:
    name: transaction-service

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: jdbc:postgresql://postgres:5432/vbank_transactions
    username: vbank
    password: vbank_password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
account:
    service:
      url: http://account-service:8082